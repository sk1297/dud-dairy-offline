  <!-- Ears -->
  <ellipse cx="0" cy="0" rx="50" ry="28" fill="#059669" transform="translate(150 244) rotate(-32)"/>
  <ellipse cx="0" cy="0" rx="50" ry="28" fill="#059669" transform="translate(362 244) rotate(32)"/>

  <!-- Head -->
  <path d="M256 150
